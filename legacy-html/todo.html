<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080c;
    --bg-glow: #0a131c;
    --panel: #0d1620;
    --panel-light: #122233;
    --teal: #3fd0e0;
    --gold: #e0a93f;
    --red: #e04f4f;
    --text: #cfe8ec;
    --dim: #5c7a85;
  }
  html[data-theme="light"] {
    --bg: #dfe6ea;
    --bg-glow: #f4f8fa;
    --panel: #ffffff;
    --panel-light: #e7edf0;
    --teal: #0891a6;
    --gold: #a66a12;
    --red: #c23b3b;
    --text: #1c2a30;
    --dim: #8a9aa2;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background: radial-gradient(ellipse at top, var(--bg-glow) 0%, var(--bg) 70%) no-repeat;
    background-attachment: fixed;
    background-size: cover;
    transition: background 0.2s;
  }
  body {
    font-family: 'Share Tech Mono', monospace;
    color: var(--text);
    max-width: 820px;
    margin: 40px auto;
    padding: 0 16px;
  }
  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .app-main {
    flex: 1;
    min-width: 0;
    max-width: 480px;
  }
  .audit-log-wrap {
    flex: none;
    display: flex;
    align-items: flex-start;
  }
  .audit-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    width: 22px;
    height: 44px;
    margin-top: 18px;
    background: var(--panel-light);
    border: 1px solid var(--teal);
    color: var(--teal);
    cursor: pointer;
    clip-path: polygon(0 6px, 100% 0, 100% 100%, 0 calc(100% - 6px));
    transition: background 0.15s, color 0.15s;
  }
  .audit-toggle:hover {
    background: var(--teal);
    color: #0d1620;
    box-shadow: 0 0 8px rgba(63, 208, 224, 0.7);
  }
  .audit-toggle svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
    transition: transform 0.2s;
  }
  .audit-toggle.clicked {
    animation: btn-pulse 0.3s ease-out;
  }
  .audit-log-wrap.collapsed .audit-toggle svg {
    transform: rotate(180deg);
  }
  .audit-log {
    width: 260px;
    background: var(--panel);
    border: 1px solid #1d3444;
    border-right: 3px solid var(--teal);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    padding: 12px;
    max-height: 70vh;
    overflow: hidden;
    transition: width 0.2s, padding 0.2s, border-width 0.2s;
  }
  .audit-log-wrap.collapsed .audit-log {
    width: 0;
    padding: 12px 0;
    border-width: 0;
  }
  .audit-log-inner {
    width: 236px;
    max-height: calc(70vh - 24px);
    overflow-y: auto;
  }
  .audit-log h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--teal);
    text-transform: uppercase;
    margin: 0 0 10px;
    border-bottom: 1px solid var(--dim);
    padding-bottom: 8px;
  }
  .audit-log ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .audit-log li {
    display: block;
    background: none;
    border: none;
    border-left: 2px solid var(--dim);
    clip-path: none;
    padding: 2px 0 2px 8px;
    margin: 0;
    font-size: 12px;
    line-height: 1.4;
    color: var(--text);
    animation: log-in 0.2s ease-out;
  }
  .audit-log li .ts {
    color: var(--gold);
    margin-right: 4px;
  }
  @keyframes log-in {
    0% { opacity: 0; transform: translateX(6px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .audit-log .empty {
    color: var(--dim);
    font-size: 12px;
  }
  @media (max-width: 760px) {
    .layout {
      flex-direction: column;
    }
    .app-main {
      max-width: none;
      width: 100%;
    }
    .audit-log {
      width: 100%;
      max-height: 240px;
    }
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--teal);
    text-shadow: 0 0 8px rgba(63, 208, 224, 0.6);
    text-align: center;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .theme-bar {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 24px 0 8px;
  }
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-size: 11px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--panel-light);
    border: 1px solid var(--dim);
    color: var(--dim);
    cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
  }
  .theme-btn svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
  }
  .theme-btn.active {
    border-color: var(--teal);
    color: var(--teal);
    box-shadow: 0 0 6px rgba(63, 208, 224, 0.5);
  }
  .theme-btn.clicked {
    animation: btn-pulse 0.3s ease-out;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    font-family: 'Share Tech Mono', monospace;
    background: var(--panel);
    border: 1px solid var(--teal);
    color: var(--text);
    outline: none;
    clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px);
  }
  input[type="text"]:focus {
    box-shadow: 0 0 6px rgba(63, 208, 224, 0.6);
  }
  button {
    padding: 10px 14px;
    font-size: 13px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--panel-light);
    border: 1px solid var(--gold);
    color: var(--gold);
    cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
    transition: background 0.15s, color 0.15s;
  }
  button:hover {
    background: var(--gold);
    color: #0d1620;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    flex: none;
    font-size: 15px;
    background: var(--panel-light);
    border: 1px solid var(--teal);
    color: var(--teal);
    cursor: pointer;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
    transition: background 0.15s, color 0.15s, transform 0.1s;
    position: relative;
    overflow: visible;
  }
  .icon-btn:hover {
    background: var(--teal);
    color: #0d1620;
    box-shadow: 0 0 8px rgba(63, 208, 224, 0.7);
  }
  .icon-btn.edit-btn {
    border-color: var(--gold);
    color: var(--gold);
  }
  .icon-btn.edit-btn:hover {
    background: var(--gold);
    color: #0d1620;
    box-shadow: 0 0 8px rgba(224, 169, 63, 0.7);
  }
  .icon-btn.delete-btn {
    border-color: var(--red);
    color: var(--red);
  }
  .icon-btn.delete-btn:hover {
    background: var(--red);
    color: #0d1620;
    box-shadow: 0 0 8px rgba(224, 79, 79, 0.7);
  }
  .icon-btn.add-btn {
    width: 44px;
    height: 44px;
    font-size: 20px;
    border-color: var(--gold);
    color: var(--gold);
  }
  .icon-btn.add-btn:hover {
    background: var(--gold);
    color: #0d1620;
    box-shadow: 0 0 8px rgba(224, 169, 63, 0.7);
  }
  .icon-btn.clicked {
    animation: btn-pulse 0.3s ease-out;
  }
  @keyframes btn-pulse {
    0% { transform: scale(1); }
    40% { transform: scale(0.85); box-shadow: 0 0 16px currentColor; }
    100% { transform: scale(1); }
  }
  .icon-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid currentColor;
    opacity: 0;
    clip-path: inherit;
  }
  .icon-btn.clicked::after {
    animation: btn-ring 0.4s ease-out;
  }
  @keyframes btn-ring {
    0% { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.8); }
  }
  .icon-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    pointer-events: none;
  }
  .icon-btn.add-btn svg {
    width: 20px;
    height: 20px;
  }
  .icon-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    border-color: var(--dim);
    color: var(--dim);
    box-shadow: none;
  }
  .icon-btn:disabled:hover {
    background: var(--panel-light);
    color: var(--dim);
    box-shadow: none;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--panel);
    border: 1px solid #1d3444;
    border-left: 3px solid var(--teal);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
  }
  li.done {
    border-left-color: var(--dim);
    opacity: 0.55;
  }
  li input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--teal);
    cursor: pointer;
  }
  li span {
    flex: 1;
    font-size: 15px;
  }
  li.done span {
    text-decoration: line-through;
    color: var(--dim);
  }
</style>
</head>
<body>
  <div class="theme-bar" id="theme-bar">
    <button type="button" class="theme-btn" data-theme="dark" title="Dark mode">
      <svg viewBox="0 0 24 24"><path d="M12.1 2a10 10 0 1 0 9.9 11.9A8 8 0 0 1 12.1 2z"/></svg>
      Dark
    </button>
    <button type="button" class="theme-btn" data-theme="light" title="Light mode">
      <svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 1v3M12 20v3M3.5 3.5l2.1 2.1M18.4 18.4l2.1 2.1M1 12h3M20 12h3M3.5 20.5l2.1-2.1M18.4 5.6l2.1-2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      Light
    </button>
  </div>
  <div class="layout">
    <div class="app-main">
      <h1>&gt; Objectives</h1>
      <form id="add-form">
        <input type="text" id="new-item" placeholder="New objective..." autofocus>
        <button type="submit" class="icon-btn add-btn" title="Add">
          <svg viewBox="0 0 24 24"><path d="M11 3h2v8h8v2h-8v8h-2v-8H3v-2h8z"/></svg>
        </button>
      </form>
      <ul id="list"></ul>
    </div>
    <div class="audit-log-wrap" id="audit-log-wrap">
      <button type="button" class="audit-toggle" id="audit-toggle" title="Toggle audit log">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="audit-log">
        <div class="audit-log-inner">
          <h2>&gt; Audit Log</h2>
          <ul id="audit-list">
            <li class="empty">No activity yet.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('add-form');
    const input = document.getElementById('new-item');
    const list = document.getElementById('list');
    const themeBar = document.getElementById('theme-bar');
    const themeButtons = themeBar.querySelectorAll('.theme-btn');
    const auditList = document.getElementById('audit-list');
    const auditWrap = document.getElementById('audit-log-wrap');
    const auditToggle = document.getElementById('audit-toggle');

    function logEvent(message) {
      const placeholder = auditList.querySelector('.empty');
      if (placeholder) placeholder.remove();
      const li = document.createElement('li');
      const tsSpan = document.createElement('span');
      tsSpan.className = 'ts';
      tsSpan.textContent = new Date().toLocaleTimeString() + ':';
      li.appendChild(tsSpan);
      li.appendChild(document.createTextNode(' ' + message));
      auditList.prepend(li);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function beep({ freq = 440, duration = 0.12, type = 'square', startFreq, endFreq, volume = 0.15 }) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      const now = audioCtx.currentTime;

      if (startFreq && endFreq) {
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
      } else {
        osc.frequency.setValueAtTime(freq, now);
      }

      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    const sounds = {
      add: () => beep({ startFreq: 500, endFreq: 1000, duration: 0.15, type: 'square' }),
      complete: () => beep({ startFreq: 800, endFreq: 1600, duration: 0.18, type: 'triangle' }),
      uncomplete: () => beep({ startFreq: 600, endFreq: 300, duration: 0.15, type: 'triangle' }),
      edit: () => beep({ freq: 1200, duration: 0.08, type: 'sawtooth', volume: 0.1 }),
      delete: () => beep({ startFreq: 400, endFreq: 100, duration: 0.25, type: 'sawtooth', volume: 0.18 }),
      theme: () => beep({ startFreq: 700, endFreq: 1100, duration: 0.1, type: 'square', volume: 0.12 }),
      toggle: () => beep({ startFreq: 900, endFreq: 500, duration: 0.1, type: 'square', volume: 0.1 }),
    };

    function resumeAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function pulse(btn) {
      btn.classList.remove('clicked');
      void btn.offsetWidth;
      btn.classList.add('clicked');
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
      try { localStorage.setItem('todo-theme', theme); } catch (e) {}
    }

    themeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        resumeAudio();
        pulse(btn);
        sounds.theme();
        setTheme(btn.dataset.theme);
        logEvent('Theme switched to ' + btn.dataset.theme + ' mode');
      });
    });

    let savedTheme = 'dark';
    try { savedTheme = localStorage.getItem('todo-theme') || 'dark'; } catch (e) {}
    setTheme(savedTheme);

    function setAuditCollapsed(collapsed) {
      auditWrap.classList.toggle('collapsed', collapsed);
      try { localStorage.setItem('todo-audit-collapsed', collapsed ? '1' : '0'); } catch (e) {}
    }

    auditToggle.addEventListener('click', () => {
      resumeAudio();
      pulse(auditToggle);
      sounds.toggle();
      setAuditCollapsed(!auditWrap.classList.contains('collapsed'));
    });

    let savedAuditCollapsed = false;
    try { savedAuditCollapsed = localStorage.getItem('todo-audit-collapsed') === '1'; } catch (e) {}
    setAuditCollapsed(savedAuditCollapsed);

    const addBtn = form.querySelector('.add-btn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      resumeAudio();
      pulse(addBtn);
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      const span = document.createElement('span');
      span.textContent = text;

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'icon-btn edit-btn';
      editBtn.title = 'Edit';
      editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'icon-btn delete-btn';
      deleteBtn.title = 'Delete';
      deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-4h6l1 2h4v2H2V5h4l1-2z"/></svg>';

      checkbox.addEventListener('change', () => {
        li.classList.toggle('done', checkbox.checked);
        editBtn.disabled = checkbox.checked;
        deleteBtn.disabled = checkbox.checked;
        checkbox.checked ? sounds.complete() : sounds.uncomplete();
        logEvent((checkbox.checked ? 'Completed objective "' : 'Reopened objective "') + span.textContent + '"');
      });

      editBtn.addEventListener('click', () => {
        pulse(editBtn);
        sounds.edit();
        const oldText = span.textContent;
        const updated = prompt('Edit objective:', oldText);
        if (updated !== null && updated.trim()) {
          span.textContent = updated.trim();
          logEvent('Edited objective "' + oldText + '" to "' + span.textContent + '"');
        }
      });

      deleteBtn.addEventListener('click', () => {
        pulse(deleteBtn);
        sounds.delete();
        logEvent('Deleted objective "' + span.textContent + '"');
        li.style.transition = 'opacity 0.2s, transform 0.2s';
        li.style.opacity = '0';
        li.style.transform = 'scaleY(0)';
        setTimeout(() => li.remove(), 200);
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(editBtn);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      sounds.add();
      logEvent('Added objective "' + text + '"');
      input.value = '';
      input.focus();
    });
  </script>
</body>
</html>
